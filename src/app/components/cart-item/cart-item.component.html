<div class="row cart-item align-items-center mb-3">
  <div class="col-md-3">
    <img
      [src]="productCartItem().product.url"
      [alt]="productCartItem().product.name"
      class="img-fluid rounded"
      style="max-height: 100px; object-fit: contain;"
    />
  </div>

  <div class="col-md-5">
    <h5 class="card-title">{{ productCartItem().product.name }}</h5>
    <p class="text-muted">Categoría: {{ productCartItem().product.category || 'N/A' }}</p>
  </div>

  <div class="col-md-2">
    <div class="input-group">
      <button
        class="btn btn-outline-secondary btn-sm"
        type="button"
        (click)="productCartItem().quantity > 1 ? onDecrease.emit(productCartItem()) : null"
        aria-label="Disminuir cantidad"
      >
        -
      </button>
      <input
        type="text"
        class="form-control form-control-sm text-center quantity-input"
        [value]="productCartItem().quantity"
        readonly
        style="max-width: 80px"
      />
      <button
        class="btn btn-outline-secondary btn-sm"
        type="button"
        (click)="onIncrease.emit(productCartItem())"
        aria-label="Aumentar cantidad"
      >
        +
      </button>
    </div>
  </div>

  <div class="col-md-2 text-end">
    <p class="fw-bold">
      {{ (productCartItem().product.price * productCartItem().quantity) | currency }}
    </p>
    <button
      class="btn btn-sm btn-outline-danger"
      (click)="onRemove.emit(productCartItem().product.id)"
      aria-label="Eliminar producto"
    >
      <i class="bi bi-trash"></i>
    </button>
  </div>
</div>
