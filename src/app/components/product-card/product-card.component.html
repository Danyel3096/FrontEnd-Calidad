<div class="w-full max-w-sm border border-gray-200 rounded-3xl shadow-lg overflow-hidden transition hover:shadow-xl p-4 dark:bg-gray-800 dark:border-gray-700"
     [ngStyle]="{ backgroundColor: homePageColor.backgroundQuaternary }">

  <!-- Imagen: siempre del mismo tamaño -->
  <div class="aspect-[4/3] w-full overflow-hidden rounded-xl mb-4">
    <a [routerLink]="['/product', product.id]">
      <img
        class="w-full h-full object-cover"
        [src]="product.url"
        [alt]="product.name" />
    </a>
  </div>

  <!-- Contenido -->
  <div class="p-5">
    <a [routerLink]="['/product', product.id]" class="hover:underline">
      <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white truncate mb-1">
        {{ product.name }}
      </h2>
    </a>

    <app-rating-stars [ratingRate]="product.ratingRate" [ratingCount]="product.ratingCount"></app-rating-stars>

    <p class="text-sm text-gray-600 dark:text-gray-300 mb-2">
      <strong>Categoría:</strong> {{ product.category.name }}
    </p>

    <p class="mb-3 font-normal text-gray-700 dark:text-gray-400">
      {{ product.description }}
    </p>

    <div class="flex justify-start">
      <a href="#" class="inline-flex items-center px-3 py-2 text-sm font-medium text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
        Ver más
        <svg class="rtl:rotate-180 w-3.5 h-3.5 ms-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
        </svg>
      </a>
    </div> 

    <div class="flex items-center justify-between">
      <span class="text-3xl font-bold text-gray-900 dark:text-white">
        $ {{ product.price }}
      </span>
    </div>

    <div class="flex justify-end mt-3">
      <button class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-black font-medium py-2 px-4 rounded-full transition"
              (click)="addToCart.emit(product)">
        🛒 Agregar al carrito
      </button>
    </div>
  </div>
</div>
