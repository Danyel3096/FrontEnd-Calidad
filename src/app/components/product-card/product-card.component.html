<div class="bg-white rounded-3xl shadow-lg overflow-hidden border border-gray-200 dark:bg-gray-800 dark:border-gray-700 transition hover:shadow-xl max-w-full p-4">
  <a [routerLink]="['/product', product.id]">
<img
  class="w-full h-60 object-cover rounded-xl mb-4"
  [src]="product.url"
  [alt]="product.name"
/>

  </a>

  <div>
    <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-1 truncate">
      <a [routerLink]="['/product', product.id]" class="hover:underline">
        {{ product.name }}
      </a>
    </h2>

    <p class="text-sm text-gray-600 dark:text-gray-300 mb-2">
      <strong>Categoría:</strong>   {{ product.category.name }}
    </p>

    <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 line-clamp-3">
      {{ product.description }}
    </p>

    <div class="flex justify-center">
      <button
        class="flex items-center gap-2 bg-green-600 hover:bg-green-700 text-black font-medium py-2 px-4 rounded-full transition"
        (click)="addToCart.emit(product)">
        🛒 Agregar al carrito
      </button>
    </div>
  </div>
</div>
