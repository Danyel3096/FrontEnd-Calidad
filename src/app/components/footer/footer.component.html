<!-- <p>footer works!</p> -->
<div class="container-fluid" [ngStyle]="{ backgroundColor: footerColor.background, color: footerColor.text }">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div *ngIf="company() as companyData" class="col-md-4 d-flex align-items-center">
            <div class="col mb-3">
                <h5>Información</h5>
                <ul class="nav flex-column">
                    <!-- <li class="nav-item mb-2">Logo</li> -->
                    <li class="nav-item mb-2">{{ companyData.name }}</li>
                    <li class="nav-item mb-2">{{ companyData.nit }}</li>
                    <!-- <li class="nav-item mb-2">{{ companyData.logo }}</li> -->
                    <li class="nav-item mb-2">{{ companyData.phone }}</li>
                    <li class="nav-item mb-2">{{ companyData.email }}</li>
                    <li class="nav-item mb-2">{{ companyData.address }}</li>
                    <!-- <li class="nav-item mb-2">Etc etc</li> -->
                </ul>
              </div>
        </div>
        <div class="col-md-4 d-flex justify-content-center">
            <a href="/" class="mb-3 me-2 mb-md-0 text-white lh-1" aria-label="Bootstrap">
                <svg class="bi" width="30" height="24" aria-hidden="true"><use xlink:href="#bootstrap"></use></svg>
            </a>
            <span class="mb-3 mb-md-0">© 2025 Company, Inc</span><!-- class+=text-body-secondary -->
        </div>
        <ul *ngIf="socialMedia() as socialMediaData" class="nav col-md-4 justify-content-end list-unstyled d-flex">
            <li *ngIf="socialMediaData.WhatsAppUrl" class="ms-3">
                <a [href]="socialMediaData.WhatsAppUrl" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" [ngStyle]="{
                backgroundColor: hoveredLinkItem === 'userToggle' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === 'userToggle' ? footerColor.hoverText : footerColor.text
                 }"
                (mouseenter)="hoveredLinkItem = 'userToggle'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-whatsapp fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.FacebookUrl" class="ms-3">
                <a [href]="socialMediaData.FacebookUrl" target="_blank" rel="noopener noreferrer" aria-label="Facebook" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '0' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '0' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '0'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-facebook fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.XTwitterUrl" class="ms-3">
                <a [href]="socialMediaData.XTwitterUrl" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '1' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '1' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '1'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-x-twitter fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.ThreadsUrl" class="ms-3">
                <a [href]="socialMediaData.ThreadsUrl" target="_blank" rel="noopener noreferrer" aria-label="Threads" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '2' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '2' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '2'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-threads fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.PinterestUrl" class="ms-3">
                <a [href]="socialMediaData.PinterestUrl" target="_blank" rel="noopener noreferrer" aria-label="Pinterest" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '3' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '3' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '3'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-pinterest fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.LinkedInUrl" class="ms-3">
                <a [href]="socialMediaData.LinkedInUrl" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '4' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '4' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '4'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-linkedin fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.YouTubeUrl" class="ms-3">
                <a [href]="socialMediaData.YouTubeUrl" target="_blank" rel="noopener noreferrer" aria-label="YouTube" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '5' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '5' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '5'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-youtube fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.InstagramUrl" class="ms-3">
                <a [href]="socialMediaData.InstagramUrl" target="_blank" rel="noopener noreferrer" aria-label="Instagram" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '6' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '6' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '6'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-instagram fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.RedditUrl" class="ms-3">
                <a [href]="socialMediaData.RedditUrl" target="_blank" rel="noopener noreferrer" aria-label="Reddit" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '7' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '7' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '7'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-reddit fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.SnapchatUrl" class="ms-3">
                <a [href]="socialMediaData.SnapchatUrl" target="_blank" rel="noopener noreferrer" aria-label="Snapchat" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '8' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '8' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '8'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-snapchat fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.TumblrUrl" class="ms-3">
                <a [href]="socialMediaData.TumblrUrl" target="_blank" rel="noopener noreferrer" aria-label="Tumblr" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '9' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '9' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '9'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-tumblr fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.VimeoUrl" class="ms-3">
                <a [href]="socialMediaData.VimeoUrl" target="_blank" rel="noopener noreferrer" aria-label="Vimeo" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '10' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '10' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '10'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-vimeo fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
            <li *ngIf="socialMediaData.GooglePlusUrl" class="ms-3">
                <a [href]="socialMediaData.GooglePlusUrl" target="_blank" rel="noopener noreferrer" aria-label="Google+" [ngStyle]="{
                backgroundColor: hoveredLinkItem === '11' ? footerColor.hoverBackground : footerColor.background,
                color: hoveredLinkItem === '11' ? footerColor.hoverText : footerColor.text
                    }"
                (mouseenter)="hoveredLinkItem = '11'"
                (mouseleave)="hoveredLinkItem = null">
                    <i class="fa-brands fa-square-google-plus fa-lg"></i>
                </a>
            </li><!-- class+=text-body-secondary -->
        </ul>
    </footer>
</div>
