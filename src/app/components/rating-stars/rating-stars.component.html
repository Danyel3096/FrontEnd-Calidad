<!-- <p>rating-stars works!</p> -->
 <div class="flex items-center mt-2.5 mb-3">
  <div class="flex items-center space-x-1 rtl:space-x-reverse">
    <ng-container *ngFor="let star of fullStars">
      <fa-icon [icon]="solidStar" [size]="'lg'" class="text-warning"></fa-icon>
    </ng-container>

    <ng-container *ngFor="let star of emptyStars">
      <fa-icon [icon]="regularStar" [size]="'lg'" class="text-warning"></fa-icon>
    </ng-container>
  </div>
  <h4 class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-sm dark:bg-blue-200 dark:text-blue-800 ms-3">
    {{ ratingRate }} ({{ ratingCount }})
  </h4>
</div>
