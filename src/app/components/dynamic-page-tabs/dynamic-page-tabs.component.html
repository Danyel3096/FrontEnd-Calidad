<!-- <p>dynamic-page-tabs works!</p> -->
<div class="tw mb-4 flex flex-wrap gap-3 justify-center">
<button
    *ngFor="let tab of tabs"
    (click)="onTabClick(tab)"
    [attr.value]="tab.id"
    [ngStyle]="{
        backgroundColor: hoveredTabItem === tab.id || selectedTabItem === tab.id ? color.hoverBackground : color.background,
        color: hoveredTabItem === tab.id || selectedTabItem === tab.id ? color.hoverText : color.text
    }"
    class="px-4 py-2 rounded transition"
    (mouseenter)="hoveredTabItem = tab.id"
    (mouseleave)="hoveredTabItem = null"
>
    {{ tab.name | titlecase }}
</button>
</div>
