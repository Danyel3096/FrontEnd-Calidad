<div class="container mt-5">
  <hr />
  <h3 class="mb-4 text-center">Otros productos que podrían interesarte</h3>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100 shadow-sm">
        <img
          [src]="product.url"
          class="card-img-top"
          alt="{{ product.name }}"
          style="height: 200px; object-fit: contain;"
        />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text text-muted" style="flex: 1">
            {{ product.description | slice: 0:100 }}...
          </p>
          <div class="mt-auto">
            <p class="fw-bold text-primary">{{ product.price | currency }}</p>
            <button class="btn btn-outline-primary w-100" [routerLink]="['/product', product.id]">
              Ver producto
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <hr />
</div>
