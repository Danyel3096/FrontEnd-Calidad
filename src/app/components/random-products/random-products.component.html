<div class="my-12">
  <hr class="mb-6 border-gray-300 dark:border-gray-700" />
  <h3 class="text-lg font-semibold mb-6 text-gray-800 dark:text-white">Otras publicaciones interesantes</h3>

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    <div *ngFor="let product of products" class="border border-gray-200 dark:border-gray-700 rounded-lg p-4 shadow-sm hover:shadow-md transition">
      <h4 class="text-md font-bold text-gray-800 dark:text-white mb-2">
        {{ product.name }}
      </h4>
      <p class="text-sm text-gray-600 dark:text-gray-400">
        {{ product.description | slice:0:100 }}...
      </p>
    </div>
  </div>

  <hr class="mt-6 border-gray-300 dark:border-gray-700" />
</div>
