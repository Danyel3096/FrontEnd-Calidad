<!-- Mostramos el componente de categorías -->
<div class="mb-4">

</div>

<!-- Resto del contenido: listado de productos -->
<div class="grid grid-cols-[repeat(3,400px)] gap-10 justify-center">
  <app-product-card
    *ngFor="let product of paginatedProducts; trackBy: trackById"
    class="block"
    [product]="product"
    (addToCart)="addToCart(product)"
  ></app-product-card>
</div>


<!-- Paginación -->
<div *ngIf="totalPages > 1" class="flex justify-center fixed bottom-0 w-screen bg-white py-4 shadow-md z-50">
  <ul class="pagination flex gap-2">
    <li>
      <button
        (click)="pageChanged('previous')"
        [disabled]="currentPage === 1"
        [ngClass]="{
          'px-3 py-1 rounded': true,
          'bg-gray-200 hover:bg-gray-300': currentPage !== 1,
          'opacity-50 cursor-not-allowed bg-gray-200': currentPage === 1
        }"
      >
        Anterior
      </button>
    </li>

    <li *ngFor="let n of [].constructor(totalPages); let i = index">
      <button
        (click)="pageChanged((i + 1).toString())"
        [ngClass]="{
          'px-3 py-1 rounded': true,
          'bg-blue-500 text-white': currentPage === i + 1,
          'bg-gray-200 hover:bg-blue-300': currentPage !== i + 1
        }"
      >
        {{ i + 1 }}
      </button>
    </li>

    <li>
      <button
        (click)="pageChanged('next')"
        [disabled]="currentPage === totalPages"
        [ngClass]="{
          'px-3 py-1 rounded': true,
          'bg-gray-200 hover:bg-gray-300': currentPage !== totalPages,
          'opacity-50 cursor-not-allowed bg-gray-200': currentPage === totalPages
        }"
      >
        Siguiente
      </button>
    </li>
  </ul>
</div>
