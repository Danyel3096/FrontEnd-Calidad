<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-lg p-4">
      <div class="text-center mb-3">
        <img src="assets/login1.png" width="100" height="100" alt="Logo" class="logo">
      </div>

      <h2 class="text-center mb-3">Registrarse aquí</h2>
<form (ngSubmit)="formSubmit()" #registerForm="ngForm">

  <!-- Nombre -->
  <div class="mb-3 input-group">
    <span class="input-group-text"><i class="fas fa-user"></i></span>
    <input type="text" class="form-control" [(ngModel)]="user.firstName" name="firstName" required placeholder="Nombre">
  </div>

  <!-- Apellido -->
  <div class="mb-3 input-group">
    <span class="input-group-text"><i class="fas fa-user"></i></span>
    <input type="text" class="form-control" [(ngModel)]="user.lastName" name="lastName" required placeholder="Apellido">
  </div>

  <!-- Email -->
  <div class="mb-3 input-group">
    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
    <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required placeholder="Correo electrónico">
  </div>

  <!-- Contraseña -->
  <div class="mb-3 input-group">
    <span class="input-group-text"><i class="fas fa-lock"></i></span>
    <input type="password" class="form-control" [(ngModel)]="user.password" name="password" required placeholder="Contraseña">
  </div>

  <!-- Dirección -->
  <div class="mb-3 input-group">
    <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
    <input type="text" class="form-control" [(ngModel)]="user.address" name="address" placeholder="Dirección">
  </div>

  <!-- Número de teléfono -->
  <div class="mb-3 input-group">
    <span class="input-group-text"><i class="fas fa-phone"></i></span>
    <input type="text" class="form-control" [(ngModel)]="user.phoneNumber" name="phoneNumber" required placeholder="Número de teléfono">
  </div>


  <div class="text-center">
    <button type="submit" class="btn btn-primary w-100">
      <i class="fas fa-user-plus"></i> Registrarse
    </button>
    <button type="reset" class="btn btn-secondary w-100 mt-2">
      <i class="fas fa-eraser"></i> Borrar
    </button>
  </div>
</form>

    </div>
  </div>
</div>
