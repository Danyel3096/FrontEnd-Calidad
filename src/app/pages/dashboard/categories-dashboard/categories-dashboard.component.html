<div class="d-flex flex-row flex-shrink-0 row">
  <div class="col-12 flex-column flex-grow-1 p-3">
    <table id="myTable" class="display table table-striped table-bordered w-100">
      <thead>
        <tr>
          <th>ID</th>
          <th>ID Tienda</th>
          <th>Nombre</th>
          <th>Descripcion</th>
          <th>Estado</th>
          <th>Fecha de Creación</th>
          <th class="text-center no-export">Acciones</th> <!-- Columna de botones -->
        </tr>
      </thead>
      
      <tbody>
        <tr *ngFor="let category of categories">
          <td>{{ category.id }}</td>
          <td>{{ category.storeId }}</td>
          <td>{{ category.name }}</td>
          <td>{{ category.description }}</td>
          <td>{{ category.status }}</td>
          <td>{{ category.creationDate }}</td>
          <td class="text-center">
              <button class="btn btn-info btn-sm mx-1" (click)="seeCategory(category)">
                  <i class="fas fa-eye"></i>
              </button>
              <button class="btn btn-warning btn-sm mx-1" (click)="editCategory(category)">
                  <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm mx-1" (click)="deleteCategory(category.id)">
                  <i class="fas fa-trash"></i>
              </button>
            

          </td>
        </tr>
    </table>
  </div>
</div>

  <!-- Modal para Ver/Editar Categoría -->
<div id="categoryModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            {{ modalMode === 'view' ? 'Ver Categoría' : 'Editar Categoría' }}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form #categoryForm="ngForm">
            <div class="mb-3">
              <label class="form-label">ID</label>
              <input *ngIf="selectedCategory?.id" type="text" class="form-control" [value]="selectedCategory.id" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">ID Tienda</label>
              <input *ngIf="selectedCategory" type="text" class="form-control" [(ngModel)]="selectedCategory.storeId" name="storeId" [disabled]="modalMode === 'view'">
            </div>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input *ngIf="selectedCategory" type="text" class="form-control" [(ngModel)]="selectedCategory.name" name="name" [disabled]="modalMode === 'view'">
            </div>
            <div class="mb-3">
              <label class="form-label">Descripción</label>
              <textarea *ngIf="selectedCategory" class="form-control" [(ngModel)]="selectedCategory.description" name="description" [disabled]="modalMode === 'view'"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select *ngIf="selectedCategory" class="form-control" [(ngModel)]="selectedCategory.status" name="status" [disabled]="modalMode === 'view'">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Fecha de Creación</label>
              <input *ngIf="selectedCategory" type="text" class="form-control" [(ngModel)]="selectedCategory.createdAt" name="createdAt" disabled>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button *ngIf="modalMode === 'edit'" type="button" class="btn btn-primary">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>
    <!-- Fin del Modal para Ver/Editar Categoría -->
