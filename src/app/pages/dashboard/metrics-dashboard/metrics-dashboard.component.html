<div class="container mt-4">
  <div id="metricas-container">
    <h2 class="text-center mb-2">Centro de Métricas</h2>
    <p class="text-center text-muted mb-5">📅 {{ fechaActual }}</p>

    <!-- KPIs -->
    <div class="row mb-5 justify-content-center text-center">
      <div class="col-md-2 col-6 mb-3" *ngFor="let kpi of kpis">
        <div class="card p-3 shadow-sm h-100">
          <small class="text-muted">{{ kpi.label }}</small>
          <h4 class="fw-bold mt-2">{{ kpi.value }}</h4>
        </div>
      </div>
    </div>

    <!-- Ticket Promedio por Día y Ingresos del Mes -->
    <div class="row mb-5">
      <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-sm h-100">
          <h5 class="mb-3">📊 Ticket promedio por día</h5>
          <canvas #ticketPromedioCanvas style="width:100%; height:300px;"></canvas>
        </div>
      </div>
      <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-sm h-100">
          <h5 class="mb-3">📈 Ingresos del mes</h5>
          <canvas #ingresosMesCanvas style="width:100%; height:300px;"></canvas>
        </div>
      </div>
    </div>

    <!-- Pie, Horizontal y Doble eje -->
    <div class="row mb-5 align-items-stretch">
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm h-100">
          <h5 class="mb-3">🥧 Productos por categoría</h5>
          <canvas #categoriasCanvas style="width:100%; height:250px;"></canvas>
        </div>
      </div>
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm h-100">
          <h5 class="mb-3">🔝 Top productos vendidos</h5>
          <canvas #topProductosCanvas style="width:100%; height:250px;"></canvas>
        </div>
      </div>
      <div class="col-md-4 mb-4">
        <div class="card p-3 shadow-sm h-100">
          <h5 class="mb-3">📊 Ingresos vs Ventas</h5>
          <canvas #ingresosVsVentasCanvas style="width:100%; height:250px;"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón para imprimir métricas -->
  <div class="text-end mb-3">
    <button class="btn btn-primary" (click)="imprimirMetricas()">
      <i class="fa fa-print me-1"></i> Imprimir
    </button>
  </div>
</div>
