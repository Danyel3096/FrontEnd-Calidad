<div class="d-flex flex-row flex-shrink-0 row">
  <div class="col-12 flex-column flex-grow-1 p-3">
    <table id="usersTable" class="display table table-striped table-bordered w-100">
      <thead>
        <tr>
          <!-- <th>ID</th> -->
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Role</th>
          <th>Estado</th>
          <th>Fecha creación</th>
          <th class="text-center no-export">Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>
  
  <!-- Modal para Ver/Editar Usuario -->
  <div id="userModal" class="modal fade" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            {{ modalMode === 'view' ? 'Ver Usuario' : 'Editar Usuario' }}
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form #userForm="ngForm">
            <div class="mb-3">
              <label class="form-label">ID</label>
              <input *ngIf="selectedUser?.id" type="text" class="form-control" [value]="selectedUser.id" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input *ngIf="selectedUser" type="text" class="form-control" [(ngModel)]="selectedUser.user" name="user" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input *ngIf="selectedUser" type="email" class="form-control" [(ngModel)]="selectedUser.email" name="email" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select *ngIf="selectedUser" class="form-control" [(ngModel)]="selectedUser.status" name="status" disabled>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Fecha de Creación</label>
              <input *ngIf="selectedUser" type="text" class="form-control" [(ngModel)]="selectedUser.created_at" name="created_at" disabled>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select *ngIf="selectedUser" class="form-control" [(ngModel)]="selectedUser.role" name="role" [disabled]="modalMode === 'view'">
                <option value="Admin">Administrador</option>
                <option value="Vendedor">Vendedor</option>
                <option value="Cliente">Cliente</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          <button *ngIf="modalMode === 'edit'" type="button" class="btn btn-primary" (click)="saveUserChanges()">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>
