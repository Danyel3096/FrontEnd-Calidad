<div class="d-flex flex-row flex-shrink-0 row">
  <div class="col-12 flex-column flex-grow-1 p-3">
    <table id="rolesTable" class="display table table-striped table-bordered w-100">
      <thead>
        <tr>
          <th>Nombre del Rol</th>
          <th class="text-center no-export">Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Modal para Ver Rol -->
<div id="roleModal" class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" [ngStyle]="{ 'background-color': pageContentColors.backgroundPage }">
        <h5 class="modal-title">Ver Rol</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" [ngStyle]="{ 'background-color': pageContentColors.backgroundPage }">
            <p>Nombre del rol: </p>
   
      </div>
      <div class="modal-footer" [ngStyle]="{ 'background-color': pageContentColors.backgroundPage }">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
