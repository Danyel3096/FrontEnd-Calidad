<!-- <p>customization-dashboard works!</p> -->
<h2 class="mb-4">Personalización de colores por sección y modo</h2>

<!-- Pestañas Light / Dark -->
<ul ngbNav #nav="ngbNav" [(activeId)]="activeMode" class="nav nav-pills mb-3">
  <li [ngbNavItem]="'light'">
    <a ngbNavLink>Modo Claro</a>
    <ng-template ngbNavContent>
      <!-- Accordion para modo Claro -->
      <div ngbAccordion class="mb-4">
        <div *ngFor="let key of sectionKeys" ngbAccordionItem>
          <h2 ngbAccordionHeader>
            <button ngbAccordionButton class="text-capitalize">Sección: {{ key }}</button>
          </h2>
          <div ngbAccordionCollapse>
            <div ngbAccordionBody>
              <app-theme-section-form
                *ngIf="lightSectionForms[key]"
                [sectionName]="key"
                [formGroup]="lightSectionForms[key]"
                (formSubmitted)="onSectionSubmit('light')">
              </app-theme-section-form>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </li>

  <li [ngbNavItem]="'dark'">
    <a ngbNavLink>Modo Oscuro</a>
    <ng-template ngbNavContent>
      <!-- Accordion para modo Oscuro -->
      <div ngbAccordion class="mb-4">
        <div *ngFor="let key of sectionKeys" ngbAccordionItem>
          <h2 ngbAccordionHeader>
            <button ngbAccordionButton class="text-capitalize">Sección: {{ key }}</button>
          </h2>
          <div ngbAccordionCollapse>
            <div ngbAccordionBody>
              <app-theme-section-form
                *ngIf="darkSectionForms[key]"
                [sectionName]="key"
                [formGroup]="darkSectionForms[key]"
                (formSubmitted)="onSectionSubmit('dark')">
              </app-theme-section-form>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </li>
</ul>

<!-- 🚨 Necesario para renderizar contenido de ngbNav -->
<div [ngbNavOutlet]="nav"></div>

<!-- Botón general -->
<button class="btn btn-primary mt-3" (click)="onFullSubmit()">Guardar Todos los Cambios</button>
