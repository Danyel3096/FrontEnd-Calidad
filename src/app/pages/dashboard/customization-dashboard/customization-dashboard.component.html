<h2 class="mb-4">Personalización de colores por sección</h2>

<div ngbAccordion class="mb-4">
  <div
    *ngFor="let key of sectionKeys"
    ngbAccordionItem
    [collapsed]="false"
    [disabled]="!sectionForms[key]"
  >
    <h2 ngbAccordionHeader>
      <button ngbAccordionButton class="text-capitalize">
        Sección: {{ key }}
      </button>
    </h2>
    <div ngbAccordionCollapse>
      <div ngbAccordionBody>
        <app-theme-section-form
          *ngIf="sectionForms[key]"
          [sectionName]="key"
          [formGroup]="sectionForms[key]"
          (formSubmitted)="onSectionSubmit(key)"
        />
      </div>
    </div>
  </div>
</div>

<hr />
<hr />
<hr />
<hr />

<form [formGroup]="themeForm" (ngSubmit)="onFullSubmit()" *ngIf="themeForm">
  <h2>Editar Colores - Modo Claro</h2>
  <div formGroupName="light">
    <div formGroupName="pageButtons">
      <label>Background:</label>
      <input formControlName="background" type="color" />

      <label>Text:</label>
      <input formControlName="text" type="color" />

      <label>Hover Background:</label>
      <input formControlName="hoverBackground" type="color" />

      <label>Hover Text:</label>
      <input formControlName="hoverText" type="color" />
    </div>
  </div>

  <h2>Editar Colores - Modo Oscuro</h2>
  <div formGroupName="dark">
    <div formGroupName="pageButtons">
      <label>Background:</label>
      <input formControlName="background" type="color" />

      <label>Text:</label>
      <input formControlName="text" type="color" />

      <label>Hover Background:</label>
      <input formControlName="hoverBackground" type="color" />

      <label>Hover Text:</label>
      <input formControlName="hoverText" type="color" />
    </div>
  </div>

  <button type="submit">Guardar Cambios</button>
</form>
