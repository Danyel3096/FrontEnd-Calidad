<div class="d-flex flex-row flex-shrink-0 row">
  <div class="col-3 flex-column sidebar-fixed">
    <!-- Aquí puedes agregar contenido adicional para la barra lateral si es necesario -->
  </div>
  <div class="col-9 flex-column flex-grow-1 p-3">
    <div class="row">
      <div class="col-12">
        <h1 class="text-center">Gestión de Productos</h1>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-12">
        <table id="productsTable" class="display table table-striped table-bordered w-100 custom-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripcion</th>
              <th>Precio</th>
              <!-- <th>Foto</th> -->
              <th>Inventario</th>
              <th>Estado</th>
              <th class="text-center no-export">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal para Ver/Editar/Crear Producto -->
<div id="productModal" class="modal fade" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          {{ modalMode === 'view' ? 'Ver Producto' : (modalMode === 'edit' ? 'Editar Producto' : 'Crear Producto') }}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form #productForm="ngForm">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input *ngIf="selectedProduct" type="text" class="form-control" [(ngModel)]="selectedProduct.name" name="name" [disabled]="modalMode === 'view'">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea *ngIf="selectedProduct" class="form-control" [(ngModel)]="selectedProduct.description" name="description" [disabled]="modalMode === 'view'"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Precio</label>
            <input *ngIf="selectedProduct" type="number" class="form-control" [(ngModel)]="selectedProduct.price" name="price" [disabled]="modalMode === 'view'">
          </div>
          <div class="mb-3">
            <label class="form-label">Inventario</label>
            <input *ngIf="selectedProduct" type="number" class="form-control" [(ngModel)]="selectedProduct.stock" name="stock" [disabled]="modalMode === 'view'">
          </div>
          <div class="mb-3">
            <label class="form-label">Foto</label>
            <input type="file" class="form-control" (change)="handleImageUpload($event)" *ngIf="modalMode === 'edit' || modalMode === 'create'">
            <img *ngIf="selectedProduct?.url" [src]="selectedProduct.url" class="img-thumbnail mt-2" width="100">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button *ngIf="modalMode !== 'view'" type="button" class="btn btn-primary" (click)="saveProductChanges()">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>
