<div class="container mt-5">
  <h2 class="mb-4">Iniciar sesión</h2>
  <form (ngSubmit)="formSubmit()">
    <div class="mb-3">
      <label for="username" class="form-label">Usuario</label>
      <input type="text" id="username" [(ngModel)]="loginData.username" name="username" class="form-control" [class.is-invalid]="inputError.username">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input type="password" id="password" [(ngModel)]="loginData.password" name="password" class="form-control" [class.is-invalid]="inputError.password">
    </div>
    <button type="submit" class="btn btn-primary">Ingresar</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="resetFields()">Borrar</button>
  </form>
</div>

<!-- Modal -->
<div class="modal fade" id="alertModal" tabindex="-1" aria-labelledby="alertModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="alertModalLabel">Error</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p></p>
      </div>
    </div>
  </div>
</div>
