<div class="container py-5">
  <h1 class="mb-5">Carrito de Compras</h1>

  <div class="row">
    <!-- Lista de productos -->
    <div class="col-lg-8">
      <div *ngIf="isLoading; else cartGrid">
        <p>Cargando carrito...</p>
      </div>

      <ng-template #cartGrid>
        <div class="card mb-4 text-black">
          <div class="card-body">
            <div *ngFor="let cartItem of state.products(); trackBy: trackById">
              <app-cart-item
                [productCartItem]="cartItem"
                (onRemove)="onRemove($event)"
                (onDecrease)="onDecrease($event)"
                (onIncrease)="onIncrease($event)">
              </app-cart-item>
              <hr *ngIf="!isLast(cartItem)" />
            </div>
          </div>
        </div>

        <!-- Botón continuar comprando -->
        <div class="text-start mb-4">
          <a routerLink="/products" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left me-2"></i>Continuar Comprando
          </a>
        </div>
      </ng-template>
    </div>

    <!-- Resumen del carrito -->
    <div class="col-lg-4">
      <div class="card cart-summary">
        <div class="card-body">
          <h5 class="card-title mb-4 text-black">Resumen del Pedido</h5>

          <div class="d-flex justify-content-between mb-3">
            <span class="text-black">Subtotal</span>
            <span class="text-black">{{ subtotal | currency }}</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-black">Envío</span>
            <span class="text-black">{{ shipping | currency }}</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-black">Impuestos</span>
            <span class="text-black">{{ tax | currency }}</span>
          </div>

          <hr />

          <div class="d-flex justify-content-between mb-4">
            <strong>Total</strong>
            <strong>{{ total | currency }}</strong>
          </div>

          <button class="btn btn-primary w-100" (click)="checkout()">Proceder al Pago</button>
        </div>
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <h5 class="card-title mb-3">Aplicar Código Promocional</h5>
          <div class="input-group mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Ingrese código promocional"
              [(ngModel)]="promoCode"
            />
            <button class="btn btn-outline-secondary" type="button" (click)="applyPromoCode()">
              Aplicar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
