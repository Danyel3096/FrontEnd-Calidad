<section class="tw bg-gray-900 py-8 antialiased dark:bg-white md:py-16">
  <div class="container py-5">
    <h2 class="mb-4">Shopping Cart</h2>
    <div class="row align-items-center border-bottom pb-3 mb-3">
      <div class="col-md-2">
        <img src="https://flowbite.s3.amazonaws.com/blocks/e-commerce/imac-front-image.png" class="img-fluid" alt="iMac image">
      </div>
      <div class="col-md-4">
        <h5 class="mb-1">Apple iMac 27”</h5>
        <p class="mb-0 text-muted">Innovative design for productivity</p>
      </div>
      <div class="col-md-2">
        <select class="form-select">
          <option selected>1</option>
          <option>2</option>
          <option>3</option>
        </select>
      </div>
      <div class="col-md-2 text-end">
        <span class="fw-bold">$2,299</span>
      </div>
      <div class="col-md-2 text-end">
        <button class="btn btn-outline-danger btn-sm">Remove</button>
      </div>
    </div>

    <div class="row">
      <!-- Contenedor de productos -->
      <div class="col-8">
        <ng-container *ngIf="isLoading; else cartGrid">
          <p>Cargando carrito...</p>
        </ng-container>

        <!-- Template con productos -->
        <ng-template #cartGrid>
          <div class="d-flex flex-column gap-3">
            <div *ngFor="let cartItem of state.products(); trackBy: trackById">
              <app-cart-item
                class="block"
                [productCartItem]="cartItem"
                (onRemove)="onRemove($event)"
                (onDecrease)="onDecrease($event)"
                (onIncrease)="onIncrease($event)">
              </app-cart-item>
            </div>
          </div>
        </ng-template>
      </div>

      <!-- Contenedor del resumen -->
      <div class="col-4">
        <div class="border-top pt-3">
          <div class="d-flex justify-content-between mb-2">
            <span class="fw-bold">Total</span>
            <span class="fw-bold">$2,299</span>
          </div>
          <button class="btn btn-primary w-100">Checkout</button>
        </div>
      </div>
    </div>
  </div>
</section>
