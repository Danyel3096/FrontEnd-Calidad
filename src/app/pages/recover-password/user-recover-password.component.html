<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-lg p-4">
      <div class="text-center mb-3">
        <img src="assets/login1.png" width="100" height="100" alt="Logo" class="logo">
      </div>

      <h2 class="text-center mb-3">Recuperar Contraseña</h2>

      <form (ngSubmit)="formSubmit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              [(ngModel)]="email"
              #emailField="ngModel"
              required
              pattern="^[\w.-]+@([\w-]+\.)+[\w-]{2,4}$"
              [ngClass]="{
                'is-invalid': emailField.invalid && emailField.touched,
                'is-valid': emailField.valid && emailField.touched
              }"
              placeholder="ejemplo@correo.com"
            >
            <div *ngIf="emailField.invalid && emailField.touched" class="invalid-feedback">
              Ingresa un correo electrónico válido.
            </div>
            <div *ngIf="emailField.valid && emailField.touched" class="valid-feedback">
              ¡Correo válido!
            </div>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Enviar Enlace
          </button>
          <button type="button" class="btn btn-secondary" (click)="resetFields()">
            <i class="fas fa-eraser"></i> Borrar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
